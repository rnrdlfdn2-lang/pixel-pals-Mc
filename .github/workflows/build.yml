# 설치 파일(Windows .exe / Mac .dmg)을 만들고, GitHub "Releases"에 올려요.
# 친구들 앱은 이 Releases 에서 새 버전을 확인하고 스스로 내려받아 업데이트해요.
# 사용법: 저장소의 Actions 탭 -> "build" -> Run workflow   (package.json 의 version 으로 v0.4.0 같은 릴리스가 자동으로 만들어져요)
name: build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 앱이 새 버전을 확인할 저장소 주소 기록
        shell: bash
        run: echo "{\"repo\":\"${{ github.repository }}\"}" > update-source.json
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: DDuknip-friends-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: package.json 의 버전 읽기
        id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 릴리스 만들기 (설치 파일 첨부)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: DDuknip-friends v${{ steps.ver.outputs.v }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.dmg
